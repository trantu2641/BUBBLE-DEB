name: Build BubbleMe RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          brew install ldid xz

          echo "Installing RootHide Theos..."

          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "=== THEOS ==="
          ls -la "$HOME/theos"

      - name: Install iPhoneOS SDK
        run: |
          set -e

          mkdir -p "$HOME/theos/sdks"

          rm -rf /tmp/theos-sdks

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          cd /tmp/theos-sdks

          git sparse-checkout set iPhoneOS16.5.sdk

          if [ ! -d "iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            find . -maxdepth 2 -type d
            exit 1
          fi

          cp -R \
            iPhoneOS16.5.sdk \
            "$HOME/theos/sdks/"

          echo "=== SDK installed ==="

          ls -ld \
            "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Verify build environment
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== SDK ==="

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "SDK OK"

          echo "=== Source ==="

          test -f Makefile
          test -f OrientationFix.m
          test -f RootHide.plist

          echo "Source files OK"

      - name: Build orientation dylib
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "=== Cleaning ==="

          make clean || true

          echo "=== Building dylib ==="

          make \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

          echo "=== Build output ==="

          find . \
            -type f \
            \( -name '*.dylib' -o -name '*.deb' \) \
            -print

      - name: Find built dylib
        run: |
          set -e

          echo "=== Searching dylib ==="

          FIX_DYLIB=$(find . \
            -type f \
            -name 'BubbleMeOrientationFix.dylib' \
            | head -1)

          if [ -z "$FIX_DYLIB" ]; then
            echo "ERROR: BubbleMeOrientationFix.dylib not found"

            echo "=== All dylibs ==="

            find . \
              -type f \
              -name '*.dylib' \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$FIX_DYLIB"

          mkdir -p "$RUNNER_TEMP/orientation"

          cp \
            "$FIX_DYLIB" \
            "$RUNNER_TEMP/orientation/"

          echo "FIX_DYLIB=$RUNNER_TEMP/orientation/BubbleMeOrientationFix.dylib" \
            >> "$GITHUB_ENV"

      - name: Validate orientation dylib
        run: |
          set -e

          echo "=== Orientation dylib ==="

          file "$FIX_DYLIB"

          ls -lh "$FIX_DYLIB"

          echo "=== Mach-O architecture ==="

          xcrun lipo \
            -info "$FIX_DYLIB" || true

          echo "=== Code signature ==="

          codesign -dvvv \
            "$FIX_DYLIB" 2>&1 || true

      - name: Assemble BubbleMe package
        run: |
          set -e

          PKGROOT="$RUNNER_TEMP/bubbleme-pkg"

          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries"

          mkdir -p \
            "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle"

          mkdir -p \
            "$PKGROOT/Library/PreferenceLoader/Preferences"

          echo "=== Copy original BubbleMe ==="

          cp \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"

          cp \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.plist \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"

          cp -R \
            package/Library/PreferenceBundles/BubbleMePrefs.bundle/. \
            "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle/"

          cp \
            package/Library/PreferenceLoader/Preferences/BubbleMePrefs.plist \
            "$PKGROOT/Library/PreferenceLoader/Preferences/"

          echo "=== Copy orientation fix ==="

          cp \
            "$FIX_DYLIB" \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib"

          cp \
            RootHide.plist \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.plist"

          echo "=== Verify package tree ==="

          find "$PKGROOT" \
            -type f \
            -print

          echo "=== Create control ==="

          CONTROL="$RUNNER_TEMP/control"

          rm -rf "$CONTROL"

          mkdir -p "$CONTROL"

          printf '%s\n' \
            'Package: com.dth.bubbleme' \
            'Name: BubbleMe' \
            'Description: BubbleMe with conservative landscape relayout fix' \
            'Maintainer: HieuDuongIT' \
            'Author: HieuDuongIT' \
            'Section: Tweaks' \
            'Depends: mobilesubstrate (>= 0.9.5000), firmware (>= 15.0), preferenceloader' \
            'Architecture: iphoneos-arm64e' \
            'Version: 0.0.2-alpha-1+roothide-orientation1' \
            'Installed-Size: 1200' \
            > "$CONTROL/control"

          echo '2.0' \
            > "$CONTROL/debian-binary"

          tar \
            -C "$CONTROL" \
            -czf "$RUNNER_TEMP/control.tar.gz" \
            control

          tar \
            -C "$PKGROOT" \
            -czf "$RUNNER_TEMP/data.tar.gz" \
            .

          echo "=== Create DEB ==="

          ar -cr \
            "BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb" \
            "$CONTROL/debian-binary" \
            "$RUNNER_TEMP/control.tar.gz" \
            "$RUNNER_TEMP/data.tar.gz"

          ls -lh \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb

      - name: Validate DEB
        run: |
          set -e

          DEB="BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb"

          echo "=== DEB ==="

          file "$DEB"

          echo "=== AR MEMBERS ==="

          ar t "$DEB"

          rm -rf /tmp/deb-check

          mkdir -p /tmp/deb-check

          ar -x \
            "$DEB" \
            --output /tmp/deb-check

          DATA_TAR=$(find /tmp/deb-check \
            -name 'data.tar.*' \
            | head -1)

          if [ -z "$DATA_TAR" ]; then
            echo "ERROR: data.tar not found"
            exit 1
          fi

          mkdir -p /tmp/deb-final

          tar \
            -xf "$DATA_TAR" \
            -C /tmp/deb-final

          echo "=== Final dynamic libraries ==="

          find \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries \
            -type f \
            -maxdepth 1 \
            -print

          echo "=== Original BubbleMe ==="

          file \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib

          echo "=== Orientation fix ==="

          file \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib

          echo "=== Orientation plist ==="

          cat \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.plist

          echo "=== Validation successful ==="

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: BubbleMe-orientation-fix
          path: BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb
          if-no-files-found: error
