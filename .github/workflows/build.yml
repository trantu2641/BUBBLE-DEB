name: Build BubbleMe RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -L --fail --retry 3 -o /tmp/sdk.tar.lzma \
            https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.lzma
          tar -xJf /tmp/sdk.tar.lzma -C "$HOME/theos/sdks"

      - name: Install roothide toolchain
        run: |
          git clone --depth=1 https://github.com/roothide/theos.git /tmp/roothide-theos || true
          if [ -d /tmp/roothide-theos/toolchain ]; then
            cp -R /tmp/roothide-theos/toolchain "$HOME/theos/"
          fi

      - name: Build orientation fix
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package FINALPACKAGE=1

      - name: Assemble BubbleMe package
        run: |
          set -e
          PKGROOT="$RUNNER_TEMP/bubbleme-pkg"
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle"
          mkdir -p "$PKGROOT/Library/PreferenceLoader/Preferences"

          cp package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"
          cp package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.plist "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"
          cp -R package/Library/PreferenceBundles/BubbleMePrefs.bundle/. "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle/"
          cp package/Library/PreferenceLoader/Preferences/BubbleMePrefs.plist "$PKGROOT/Library/PreferenceLoader/Preferences/"

          FIX_DEB=$(find packages -name '*BubbleMeOrientationFix*.deb' | head -1)
          if [ -z "$FIX_DEB" ]; then echo 'orientation fix DEB not found'; exit 1; fi
          mkdir -p "$RUNNER_TEMP/fix"
          ar -x "$FIX_DEB" --output "$RUNNER_TEMP/fix"
          mkdir -p "$RUNNER_TEMP/fixdata"
          tar -xf "$RUNNER_TEMP/fix/data.tar."* -C "$RUNNER_TEMP/fixdata"
          cp "$RUNNER_TEMP/fixdata/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib" "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"
          cp RootHide.plist "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.plist"

          mkdir -p "$RUNNER_TEMP/control"
          cat > "$RUNNER_TEMP/control/control" <<'CTL'
Package: com.dth.bubbleme
Name: BubbleMe
Description: BubbleMe with conservative landscape relayout fix
Maintainer: HieuDuongIT
Author: HieuDuongIT
Section: Tweaks
Depends: mobilesubstrate (>= 0.9.5000), firmware (>= 15.0), preferenceloader
Architecture: iphoneos-arm64e
Version: 0.0.2-alpha-1+roothide-orientation1
Installed-Size: 1200
CTL
          echo '2.0' > "$RUNNER_TEMP/control/debian-binary"
          tar -C "$RUNNER_TEMP/control" -czf "$RUNNER_TEMP/control.tar.gz" control
          tar -C "$PKGROOT" -czf "$RUNNER_TEMP/data.tar.gz" .
          ar -cr "BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb" "$RUNNER_TEMP/control.tar.gz" "$RUNNER_TEMP/data.tar.gz" "$RUNNER_TEMP/control/debian-binary"

      - name: Validate output
        run: |
          file BubbleMe-*.deb
          ar t BubbleMe-*.deb
          mkdir -p /tmp/check
          ar -x BubbleMe-*.deb --output /tmp/check
          tar -tzf /tmp/check/data.tar.gz | grep -E 'BubbleMe(dylib|OrientationFix.dylib|\.plist)' || true
          file package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: BubbleMe-orientation-fix
          path: BubbleMe-*.deb
