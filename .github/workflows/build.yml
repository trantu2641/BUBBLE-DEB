name: Build BubbleMe RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. INSTALL DEPENDENCIES + ROOT HIDE THEOS
      # =========================================================

      - name: Install dependencies
        run: |
          set -e

          echo "=== Installing dependencies ==="

          brew install ldid xz

          echo "=== Installing RootHide Theos ==="

          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

          echo "=== Theos installed ==="

          ls -la "$HOME/theos"


      # =========================================================
      # 3. UPDATE THEOS
      # =========================================================

      - name: Update Theos
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "=== Running update-theos ==="

          "$THEOS/bin/update-theos"

          echo "=== Checking vendor directories ==="

          test -d "$THEOS/vendor/include"
          test -d "$THEOS/vendor/lib"

          echo "Theos vendor directories OK"


      # =========================================================
      # 4. INSTALL IPHONEOS SDK
      # =========================================================

      - name: Install iPhoneOS SDK
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "=== Preparing SDK directory ==="

          mkdir -p "$THEOS/sdks"

          rm -rf /tmp/theos-sdks

          echo "=== Downloading Theos SDK repository ==="

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          cd /tmp/theos-sdks

          echo "=== Selecting iPhoneOS16.5.sdk ==="

          git sparse-checkout set iPhoneOS16.5.sdk

          if [ ! -d "iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            find . -maxdepth 3 -type d
            exit 1
          fi

          echo "=== Copying SDK ==="

          cp -R \
            iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

          echo "=== SDK installed ==="

          ls -ld \
            "$THEOS/sdks/iPhoneOS16.5.sdk"


      # =========================================================
      # 5. VERIFY THEOS ENVIRONMENT
      # =========================================================

      - name: Verify Theos environment
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "======================================"
          echo " THEOS ENVIRONMENT"
          echo "======================================"

          echo "THEOS:"
          echo "$THEOS"

          echo
          echo "SDK:"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "iPhoneOS16.5.sdk OK"

          echo
          echo "Vendor include:"

          test -d \
            "$THEOS/vendor/include"

          echo "vendor/include OK"

          echo
          echo "Vendor lib:"

          test -d \
            "$THEOS/vendor/lib"

          echo "vendor/lib OK"

          echo
          echo "RootHide package system:"

          if [ -d "$THEOS/makefiles/package" ]; then
            echo "Package directory OK"
          else
            echo "WARNING: package directory layout differs"
          fi

          echo
          echo "======================================"
          echo " THEOS CHECK PASSED"
          echo "======================================"


      # =========================================================
      # 6. VERIFY PROJECT FILES
      # =========================================================

      - name: Verify source
        run: |
          set -e

          echo "======================================"
          echo " PROJECT FILE CHECK"
          echo "======================================"

          echo
          echo "Makefile:"

          test -f Makefile

          echo "Makefile OK"

          echo
          echo "OrientationFix.m:"

          test -f OrientationFix.m

          echo "OrientationFix.m OK"

          echo
          echo "RootHide.plist:"

          test -f RootHide.plist

          echo "RootHide.plist OK"

          echo
          echo "Original BubbleMe.dylib:"

          test -f \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib

          echo "BubbleMe.dylib OK"

          echo
          echo "Original BubbleMe.plist:"

          test -f \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.plist

          echo "BubbleMe.plist OK"

          echo
          echo "Preferences:"

          test -d \
            package/Library/PreferenceBundles/BubbleMePrefs.bundle

          test -f \
            package/Library/PreferenceLoader/Preferences/BubbleMePrefs.plist

          echo "Preferences OK"

          echo
          echo "======================================"
          echo " PROJECT CHECK PASSED"
          echo "======================================"


      # =========================================================
      # 7. BUILD ORIENTATION FIX DYLIB
      # =========================================================

      - name: Build orientation dylib
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "======================================"
          echo " CLEANING"
          echo "======================================"

          make clean || true

          echo
          echo "======================================"
          echo " BUILDING DYLIB"
          echo "======================================"

          make \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1

          echo
          echo "======================================"
          echo " BUILD RESULT"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name '*.dylib' \
              -o \
              -name '*.deb' \
            \) \
            -print


      # =========================================================
      # 8. FIND ORIENTATION FIX DYLIB
      # =========================================================

      - name: Find orientation dylib
        run: |
          set -e

          echo "=== Searching for BubbleMeOrientationFix.dylib ==="

          FIX_DYLIB=$(find . \
            -type f \
            -name 'BubbleMeOrientationFix.dylib' \
            | head -1)

          if [ -z "$FIX_DYLIB" ]; then

            echo
            echo "ERROR: BubbleMeOrientationFix.dylib not found"

            echo
            echo "=== Available dylibs ==="

            find . \
              -type f \
              -name '*.dylib' \
              -print

            exit 1
          fi

          echo
          echo "Found:"
          echo "$FIX_DYLIB"

          mkdir -p \
            "$RUNNER_TEMP/orientation"

          cp \
            "$FIX_DYLIB" \
            "$RUNNER_TEMP/orientation/BubbleMeOrientationFix.dylib"

          echo \
            "FIX_DYLIB=$RUNNER_TEMP/orientation/BubbleMeOrientationFix.dylib" \
            >> "$GITHUB_ENV"


      # =========================================================
      # 9. VALIDATE DYLIB
      # =========================================================

      - name: Validate orientation dylib
        run: |
          set -e

          echo "======================================"
          echo " ORIENTATION FIX DYLIB"
          echo "======================================"

          echo
          echo "File:"

          file "$FIX_DYLIB"

          echo
          echo "Architecture:"

          xcrun lipo \
            -info \
            "$FIX_DYLIB" || true

          echo
          echo "Size:"

          ls -lh "$FIX_DYLIB"

          echo
          echo "======================================"
          echo " DYLIB VALIDATION PASSED"
          echo "======================================"


      # =========================================================
      # 10. ASSEMBLE FINAL PACKAGE
      # =========================================================

      - name: Assemble BubbleMe package
        run: |
          set -e

          PKGROOT="$RUNNER_TEMP/bubbleme-pkg"

          echo "======================================"
          echo " PREPARING PACKAGE"
          echo "======================================"

          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries"

          mkdir -p \
            "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle"

          mkdir -p \
            "$PKGROOT/Library/PreferenceLoader/Preferences"


          # -----------------------------------------------------
          # ORIGINAL BUBBLEME
          # -----------------------------------------------------

          echo
          echo "=== Copy BubbleMe.dylib ==="

          cp \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"


          echo
          echo "=== Copy BubbleMe.plist ==="

          cp \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.plist \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"


          # -----------------------------------------------------
          # PREFERENCES
          # -----------------------------------------------------

          echo
          echo "=== Copy Preference Bundle ==="

          cp -R \
            package/Library/PreferenceBundles/BubbleMePrefs.bundle/. \
            "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle/"


          echo
          echo "=== Copy PreferenceLoader plist ==="

          cp \
            package/Library/PreferenceLoader/Preferences/BubbleMePrefs.plist \
            "$PKGROOT/Library/PreferenceLoader/Preferences/"


          # -----------------------------------------------------
          # ORIENTATION FIX
          # -----------------------------------------------------

          echo
          echo "=== Copy OrientationFix.dylib ==="

          cp \
            "$FIX_DYLIB" \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib"


          echo
          echo "=== Copy OrientationFix.plist ==="

          cp \
            RootHide.plist \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.plist"


          # -----------------------------------------------------
          # SHOW PACKAGE TREE
          # -----------------------------------------------------

          echo
          echo "======================================"
          echo " PACKAGE TREE"
          echo "======================================"

          find "$PKGROOT" \
            -type f \
            -print

          echo
          echo "======================================"
          echo " PACKAGE ASSEMBLY COMPLETE"
          echo "======================================"


      # =========================================================
      # 11. CREATE DEB
      # =========================================================

      - name: Create DEB
        run: |
          set -e

          PKGROOT="$RUNNER_TEMP/bubbleme-pkg"
          CONTROL="$RUNNER_TEMP/control"

          echo "======================================"
          echo " CREATING DEB"
          echo "======================================"

          rm -rf "$CONTROL"

          mkdir -p "$CONTROL"


          # -----------------------------------------------------
          # CONTROL
          # -----------------------------------------------------

          printf '%s\n' \
            'Package: com.dth.bubbleme' \
            'Name: BubbleMe' \
            'Description: BubbleMe with conservative landscape relayout fix' \
            'Maintainer: HieuDuongIT' \
            'Author: HieuDuongIT' \
            'Section: Tweaks' \
            'Depends: mobilesubstrate (>= 0.9.5000), firmware (>= 15.0), preferenceloader' \
            'Architecture: iphoneos-arm64e' \
            'Version: 0.0.2-alpha-1+roothide-orientation1' \
            'Installed-Size: 1200' \
            > "$CONTROL/control"


          # -----------------------------------------------------
          # DEBIAN BINARY
          # -----------------------------------------------------

          echo '2.0' \
            > "$CONTROL/debian-binary"


          # -----------------------------------------------------
          # CONTROL TAR
          # -----------------------------------------------------

          tar \
            -C "$CONTROL" \
            -czf "$RUNNER_TEMP/control.tar.gz" \
            control


          # -----------------------------------------------------
          # DATA TAR
          # -----------------------------------------------------

          tar \
            -C "$PKGROOT" \
            -czf "$RUNNER_TEMP/data.tar.gz" \
            .


          # -----------------------------------------------------
          # FINAL DEB
          # -----------------------------------------------------

          ar -cr \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb \
            "$CONTROL/debian-binary" \
            "$RUNNER_TEMP/control.tar.gz" \
            "$RUNNER_TEMP/data.tar.gz"


          echo
          echo "======================================"
          echo " DEB CREATED"
          echo "======================================"

          ls -lh \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb


      # =========================================================
      # 12. VALIDATE DEB
      # =========================================================

      - name: Validate DEB
        run: |
          set -e

          DEB="$GITHUB_WORKSPACE/BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb"

          echo "======================================"
          echo " VALIDATING DEB"
          echo "======================================"

          test -f "$DEB"

          echo
          echo "=== DEB ==="

          file "$DEB"


          echo
          echo "=== MEMBERS ==="

          ar t "$DEB"


          # -----------------------------------------------------
          # EXTRACT DEB
          # -----------------------------------------------------

          rm -rf /tmp/deb-check
          rm -rf /tmp/deb-final

          mkdir -p /tmp/deb-check
          mkdir -p /tmp/deb-final

          cd /tmp/deb-check

          echo
          echo "=== Extracting DEB ==="

          ar -x "$DEB"


          echo
          echo "=== Extracted files ==="

          ls -lh


          # -----------------------------------------------------
          # FIND DATA TAR
          # -----------------------------------------------------

          DATA_TAR=$(find . \
            -maxdepth 1 \
            -name 'data.tar.*' \
            | head -1)

          if [ -z "$DATA_TAR" ]; then

            echo
            echo "ERROR: data.tar not found"

            exit 1

          fi

          echo
          echo "Found data archive:"
          echo "$DATA_TAR"


          # -----------------------------------------------------
          # EXTRACT DATA
          # -----------------------------------------------------

          echo
          echo "=== Extracting data archive ==="

          tar \
            -xf "$DATA_TAR" \
            -C /tmp/deb-final


          # -----------------------------------------------------
          # ORIGINAL BUBBLEME
          # -----------------------------------------------------

          echo
          echo "=== BubbleMe.dylib ==="

          test -f \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib

          file \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib


          # -----------------------------------------------------
          # ORIENTATION FIX
          # -----------------------------------------------------

          echo
          echo "=== BubbleMeOrientationFix.dylib ==="

          test -f \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib

          file \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib


          echo
          echo "=== OrientationFix architecture ==="

          xcrun lipo \
            -info \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib \
            || true


          # -----------------------------------------------------
          # PLISTS
          # -----------------------------------------------------

          echo
          echo "=== Plists ==="

          test -f \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMe.plist

          test -f \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.plist

          ls -lh \
            /tmp/deb-final/Library/MobileSubstrate/DynamicLibraries/*.plist


          # -----------------------------------------------------
          # PREFERENCES
          # -----------------------------------------------------

          echo
          echo "=== Preference Bundle ==="

          test -d \
            /tmp/deb-final/Library/PreferenceBundles/BubbleMePrefs.bundle

          echo
          echo "=== PreferenceLoader ==="

          test -f \
            /tmp/deb-final/Library/PreferenceLoader/Preferences/BubbleMePrefs.plist


          # -----------------------------------------------------
          # FINAL TREE
          # -----------------------------------------------------

          echo
          echo "======================================"
          echo " FINAL PACKAGE TREE"
          echo "======================================"

          find \
            /tmp/deb-final/Library \
            -type f \
            -print


          echo
          echo "======================================"
          echo " FINAL DEB VALIDATION PASSED"
          echo "======================================"


      # =========================================================
      # 13. UPLOAD FINAL DEB
      # =========================================================

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: BubbleMe-orientation-fix
          path: BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb
          if-no-files-found: error
