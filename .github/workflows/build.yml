name: Build BubbleMe RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iPhoneOS SDK
        run: |
          set -e

          mkdir -p "$HOME/theos/sdks"

          rm -rf /tmp/theos-sdks

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          cd /tmp/theos-sdks

          git sparse-checkout set iPhoneOS16.5.sdk

          if [ ! -d "iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk was not found"
            find . -maxdepth 2 -type d
            exit 1
          fi

          cp -R \
            iPhoneOS16.5.sdk \
            "$HOME/theos/sdks/"

          echo "Installed SDK:"
          ls -ld "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Install roothide toolchain
        run: |
          set -e

          rm -rf /tmp/roothide-theos

          git clone \
            --depth=1 \
            https://github.com/roothide/theos.git \
            /tmp/roothide-theos

          if [ -d "/tmp/roothide-theos/toolchain" ]; then
            cp -R \
              /tmp/roothide-theos/toolchain \
              "$HOME/theos/"
          else
            echo "ERROR: roothide toolchain not found"
            exit 1
          fi

      - name: Verify Theos
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== TOOLCHAIN ==="
          find "$THEOS/toolchain" -maxdepth 3 -type f \
            \( -name clang -o -name clang++ \) \
            -print

      - name: Build orientation fix
        run: |
          set -e

          export THEOS="$HOME/theos"

          make clean || true
          make package FINALPACKAGE=1

      - name: Assemble BubbleMe package
        run: |
          set -e

          PKGROOT="$RUNNER_TEMP/bubbleme-pkg"

          rm -rf "$PKGROOT"

          mkdir -p \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries"

          mkdir -p \
            "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle"

          mkdir -p \
            "$PKGROOT/Library/PreferenceLoader/Preferences"

          echo "=== Copy original BubbleMe ==="

          cp \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"

          cp \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.plist \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"

          cp -R \
            package/Library/PreferenceBundles/BubbleMePrefs.bundle/. \
            "$PKGROOT/Library/PreferenceBundles/BubbleMePrefs.bundle/"

          cp \
            package/Library/PreferenceLoader/Preferences/BubbleMePrefs.plist \
            "$PKGROOT/Library/PreferenceLoader/Preferences/"

          echo "=== Find orientation fix DEB ==="

          FIX_DEB=$(find packages \
            -type f \
            -name '*BubbleMeOrientationFix*.deb' \
            | head -1)

          if [ -z "$FIX_DEB" ]; then
            echo "ERROR: BubbleMeOrientationFix DEB not found"
            echo "=== packages ==="
            find packages -type f 2>/dev/null || true
            exit 1
          fi

          echo "Found:"
          echo "$FIX_DEB"

          rm -rf "$RUNNER_TEMP/fix"
          rm -rf "$RUNNER_TEMP/fixdata"

          mkdir -p "$RUNNER_TEMP/fix"
          mkdir -p "$RUNNER_TEMP/fixdata"

          ar -x "$FIX_DEB" \
            --output "$RUNNER_TEMP/fix"

          DATA_TAR=$(find "$RUNNER_TEMP/fix" \
            -name 'data.tar.*' \
            | head -1)

          if [ -z "$DATA_TAR" ]; then
            echo "ERROR: data.tar archive not found"
            exit 1
          fi

          echo "Data archive:"
          echo "$DATA_TAR"

          tar -xf "$DATA_TAR" \
            -C "$RUNNER_TEMP/fixdata"

          FIX_DYLIB="$RUNNER_TEMP/fixdata/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib"

          if [ ! -f "$FIX_DYLIB" ]; then
            echo "ERROR: BubbleMeOrientationFix.dylib not found"

            echo "=== Extracted files ==="
            find "$RUNNER_TEMP/fixdata" -type f

            exit 1
          fi

          cp \
            "$FIX_DYLIB" \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/"

          cp \
            RootHide.plist \
            "$PKGROOT/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.plist"

          echo "=== Creating control ==="

          CONTROL="$RUNNER_TEMP/control"

          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"

          printf '%s\n' \
            'Package: com.dth.bubbleme' \
            'Name: BubbleMe' \
            'Description: BubbleMe with conservative landscape relayout fix' \
            'Maintainer: HieuDuongIT' \
            'Author: HieuDuongIT' \
            'Section: Tweaks' \
            'Depends: mobilesubstrate (>= 0.9.5000), firmware (>= 15.0), preferenceloader' \
            'Architecture: iphoneos-arm64e' \
            'Version: 0.0.2-alpha-1+roothide-orientation1' \
            'Installed-Size: 1200' \
            > "$CONTROL/control"

          echo '2.0' \
            > "$CONTROL/debian-binary"

          tar \
            -C "$CONTROL" \
            -czf "$RUNNER_TEMP/control.tar.gz" \
            control

          tar \
            -C "$PKGROOT" \
            -czf "$RUNNER_TEMP/data.tar.gz" \
            .

          echo "=== Creating DEB ==="

          ar -cr \
            "BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb" \
            "$CONTROL/debian-binary" \
            "$RUNNER_TEMP/control.tar.gz" \
            "$RUNNER_TEMP/data.tar.gz"

          echo "=== DEB CREATED ==="

          ls -lh \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb

      - name: Validate output
        run: |
          set -e

          echo "=== DEB FILE ==="

          file \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb

          echo "=== DEB MEMBERS ==="

          ar t \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb

          rm -rf /tmp/check
          mkdir -p /tmp/check

          ar -x \
            BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb \
            --output /tmp/check

          DATA_TAR=$(find /tmp/check \
            -name 'data.tar.*' \
            | head -1)

          echo "=== PACKAGE CONTENTS ==="

          tar -tzf "$DATA_TAR"

          echo "=== ORIGINAL BUBBLEME ==="

          file \
            package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib

          echo "=== EXTRACT FINAL PACKAGE ==="

          rm -rf /tmp/final-package
          mkdir -p /tmp/final-package

          tar \
            -xzf "$DATA_TAR" \
            -C /tmp/final-package

          echo "=== FINAL BUBBLEME DYLIB ==="

          file \
            /tmp/final-package/Library/MobileSubstrate/DynamicLibraries/BubbleMe.dylib

          echo "=== FINAL ORIENTATION DYLIB ==="

          file \
            /tmp/final-package/Library/MobileSubstrate/DynamicLibraries/BubbleMeOrientationFix.dylib

          echo "=== DYNAMIC LIBRARIES ==="

          ls -lh \
            /tmp/final-package/Library/MobileSubstrate/DynamicLibraries/

          echo "=== VALIDATION COMPLETE ==="

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: BubbleMe-orientation-fix
          path: BubbleMe-0.0.2-alpha-1+roothide-orientation1.deb
          if-no-files-found: error
